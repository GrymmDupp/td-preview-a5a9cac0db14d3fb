<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1a">
<title>Twisted Deeds · Live navigator</title>
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/fonts/shadow-fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="live.css">
<link rel="stylesheet" href="drive.css">
<link rel="stylesheet" href="../assets/css/capture.css">
<link rel="stylesheet" href="../assets/css/prefs.css">
<script defer src="drive.js"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <a class="brand" href="../" aria-label="Back to the Twisted Deeds app"><img src="../assets/logo-shield-48.png" width="34" height="35" alt=""><span><b>Twisted</b> <i>Deeds</i> <em>LIVE</em></span></a>
    <button type="button" id="gps" class="gps off" aria-live="polite" aria-label="GPS status. Tap to turn on GPS or try again.">GPS off · tap</button>
    <button type="button" id="findbtn" class="tl" aria-label="Find a place: town, county, state or ZIP">Find</button>
  </header>
  <div id="chips" class="chips" role="group" aria-label="What to show">
    <button class="chip c-deed" data-k="deed" aria-label="Twisted Deeds" aria-pressed="false"><i>D</i><span>Deeds</span></button>
    <button class="chip c-story" data-k="story" aria-label="Strong Stories" aria-pressed="false"><i>S</i><span>Stories</span></button>
    <button class="chip c-lead" data-k="lead" aria-label="Stigmatized leads" aria-pressed="false"><i>L</i><span>Leads</span></button>
    <button class="chip c-unv" data-k="unverified" aria-label="Unverified" aria-pressed="false"><i>?</i><span>Unverified</span></button>
    <button class="chip c-arch" data-k="archive" aria-label="The Archive" aria-pressed="false"><i>A</i><span>Archive</span></button>
    <button class="chip c-ctx" data-k="context" aria-label="Context" aria-pressed="false"><i>C</i><span>Context</span></button>
  </div>
  <div id="lyrs" class="lyrs" role="group" aria-label="Map layers">
    <button class="chip lchip" data-k="hmark" aria-label="Historical markers" aria-pressed="false"><svg viewBox="0 0 16 20" width="16" height="20" aria-hidden="true"><path d="M7 12h2v7H7z" fill="#8a7a5c"/><rect x="1" y="1" width="14" height="11" rx="2" fill="#2f3a2c" stroke="#c9a96a" stroke-width="1.4"/><path d="M4 5h8M4 8h6" stroke="#c9a96a" stroke-width="1.2" stroke-linecap="round"/></svg><span>Markers</span></button>
    <button class="chip lchip" data-k="cem" aria-label="Cemeteries" aria-pressed="false"><svg viewBox="0 0 14 17" width="14" height="17" aria-hidden="true"><path d="M2 16V7a5 5 0 0 1 10 0v9z" fill="#55605a" stroke="#c7cdc4" stroke-width="1.2"/><path d="M7 6v6M5 8h4" stroke="#dfe4dc" stroke-width="1.2" stroke-linecap="round"/><path d="M0.5 16h13" stroke="#c7cdc4" stroke-width="1.2"/></svg><span>Cemeteries</span></button>
  </div>
  <div id="stage">
    <div id="map" aria-label="Map"></div>
    <div id="alert" role="alert" hidden></div>
    <form id="find" role="search" hidden>
      <input id="find-q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Town, county, state or ZIP" aria-label="Town, county, state or ZIP">
      <button type="submit" class="btn p">Go</button><button type="button" id="find-x" class="btn" aria-label="Close search">×</button>
      <div class="find-m"><span id="find-st" role="status"></span><span class="find-a">Search © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors · Nominatim</span></div>
    </form>
    <div id="toast" role="status" hidden></div>
    <button id="recenter" class="float" hidden>Recenter</button>
    <button id="pickcancel" class="float" hidden>Cancel: tap the map…</button>
    <section id="sheet" hidden aria-live="polite"><div class="sh-bar"><b id="sh-title"></b><button id="sh-close" aria-label="Close">×</button></div><div id="sh-body"></div></section>
  </div>
  <footer id="dock">
    <div class="rad">
      <label for="rad-range">Within</label>
      <input id="rad-range" type="range" min="1" max="25" step="1" value="1" aria-valuemin="1" aria-valuemax="25" aria-valuenow="1" aria-valuetext="1 mile">
      <output id="rad-val" for="rad-range">1 mi</output>
    </div>
    <div class="main">
      <button id="start" class="big go">▶ Start</button>
      <button id="here" class="big here">What’s here?</button>
    </div>
    <div class="mini">
      <button id="nearby">Nearby <span id="ncount">0</span></button>
      <button id="leads">My leads <span id="lcount">0</span></button>
      <button id="sound" aria-pressed="false">Chime: off</button>
      <button id="speak" aria-pressed="false">Speak: off</button>
    </div>
  </footer>
</div>
<script src="vendor/leaflet.js"></script>
<script src="live.js"></script>
<script type="module" src="passport-live.js"></script>
<script type="module" src="ancestors-live.js"></script>
<script type="module" src="trails-live.js"></script>
<script type="module" src="capture-live.js"></script>
<script type="module" src="prefs-live.js"></script>
</body>
</html>
