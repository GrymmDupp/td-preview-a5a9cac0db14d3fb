<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d0d">
<title>Twisted Deeds · Ancestors Trail</title>
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../live/vendor/leaflet.css">
<link rel="stylesheet" href="ancestors.css">
</head>
<body>
<header class="at-top">
  <a class="brand" href="../" aria-label="Back to the Twisted Deeds app"><img src="../assets/logo-shield-48.png" width="30" height="31" alt=""><span><b>Ancestors</b> <i>Trail</i></span></a>
  <nav><a href="../live/">Live map</a><a href="../passport/">Passport</a></nav>
  <svg class="at-spider" viewBox="0 0 40 120" width="22" height="66" aria-hidden="true"><path d="M20 0v84" stroke="#6d6253" stroke-width=".7"/><g fill="#0b0808" stroke="#8a7a5c" stroke-width=".6"><ellipse cx="20" cy="92" rx="4.2" ry="5.2"/><circle cx="20" cy="85.5" r="2.6"/></g><g stroke="#8a7a5c" stroke-width=".9" fill="none" stroke-linecap="round"><path d="M16.5 89 9 84l-3 4M16 92H7l-3 5M16.5 95 9 100l-1 6M17.5 97.5 13 105l1 6M23.5 89 31 84l3 4M24 92h9l3 5M23.5 95 31 100l1 6M22.5 97.5 27 105l-1 6"/></g></svg>
</header>
<main id="at" aria-live="polite">
  <section id="at-gate" class="at-gate" hidden></section>
  <section id="at-app" class="at-app" hidden>
    <div class="at-bar">
      <form id="at-find" role="search" class="at-find"><input id="at-q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Find an ancestor or a place" aria-label="Find an ancestor or a place"></form>
      <button type="button" class="at-b" id="at-list-btn" aria-expanded="false">List</button>
      <button type="button" class="at-b" id="at-menu-btn" aria-expanded="false" aria-label="Tree settings">☰</button>
    </div>
    <div class="at-legend" id="at-legend"></div>
    <div id="at-map" aria-label="Map of your family's places"></div>
    <aside id="at-panel" class="at-panel" hidden aria-live="polite">
      <div class="at-ph"><b id="at-pt"></b><button type="button" id="at-px" aria-label="Close">×</button></div>
      <div id="at-pb" class="at-pb"></div>
    </aside>
  </section>
  <div id="at-toast" role="status" hidden></div>
</main>
<script src="../live/vendor/leaflet.js"></script>
<script type="module" src="ancestors.js"></script>
</body>
</html>
