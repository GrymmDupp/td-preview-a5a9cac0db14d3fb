PINS.forEach(p=>{const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:'<div class="pin '+cls(p)+'"></div>',iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-12]})});
 m.bindPopup(()=>popup(p),{maxWidth:280});markers.push({p,m})});
function vis(p){if(p.cat==='context')return state.context;const far=p.mi>35;if(far&&!state.far)return false;return p.cat==='sheet'?state.sheet:state.lead}
function refresh(){layer.clearLayers();markers.forEach(o=>{if(vis(o.p))layer.addLayer(o.m)});if(document.getElementById('list').style.display==='block')renderList();checkNear()}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;state[k]=!state[k];b.classList.toggle('on',state[k]);refresh()});
function dFrom(p){const o=me||JX;return hav(o[0],o[1],p.lat,p.lon)}
function renderList(){const el=document.getElementById('list');const arr=PINS.filter(vis).map(p=>({p,d:dFrom(p)})).sort((a,b)=>a.d-b.d);
 el.innerHTML='<div style="font-size:12px;color:#bba98f;margin-bottom:4px">Sorted by distance from '+(me?'you':'downtown Jackson')+'. Tap a name to see it on the map.</div>'+arr.map(o=>'<div class="item"><a class="go" href="'+dirUrl(o.p)+'" target="_blank" rel="noopener">Go</a><div>'+tag(o.p)+'</div><b data-id="'+esc(o.p.id)+'" style="cursor:pointer">'+esc(o.p.name)+'</b><div class="m">'+o.d.toFixed(1)+' mi · '+esc(o.p.addr)+(o.p.price?' · '+esc(o.p.price):'')+'</div></div>').join('')||'<div class="item">Nothing visible with these filters.</div>';
 el.querySelectorAll('b[data-id]').forEach(b=>b.onclick=()=>{const o=markers.find(x=>x.p.id===b.dataset.id);el.style.display='none';map.setView([o.p.lat,o.p.lon],16);o.m.openPopup()})}
document.getElementById('lst').onclick=()=>{const el=document.getElementById('list');if(el.style.display==='block'){el.style.display='none'}else{renderList();el.style.display='block'}};
document.getElementById('ctr').onclick=()=>{follow=false;document.getElementById('loc').classList.remove('on');map.setView(JX,12)};
let lastAlert=null;
function checkNear(){const a=document.getElementById('alert');if(!me){a.style.display='none';return}
 const c=PINS.filter(p=>p.cat!=='context'&&vis(p)).map(p=>({p,d:hav(me[0],me[1],p.lat,p.lon)})).filter(o=>o.d<=NEAR_MI).sort((x,y)=>x.d-y.d)[0];
 if(!c){a.style.display='none';lastAlert=null;return}
 a.innerHTML='NEAR: '+esc(c.p.name)+'<small>'+c.d.toFixed(2)+' mi · '+esc(c.p.cat==='lead'?'UNVERIFIED LEAD':c.p.grade)+' · '+esc(c.p.addr)+' (tap)</small>';a.style.display='block';
 a.onclick=()=>{const o=markers.find(x=>x.p.id===c.p.id);map.setView([c.p.lat,c.p.lon],16);o.m.openPopup()};
 if(lastAlert!==c.p.id){lastAlert=c.p.id;if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}}}
function note(t){const n=document.getElementById('note');n.textContent=t;n.style.display=t?'block':'none'}
document.getElementById('loc').onclick=function(){
 if(!navigator.geolocation){note('Location not supported in this browser');return}
 if(watchId!==null&&follow){follow=false;this.classList.remove('on');this.textContent='Locate me';return}
 follow=true;this.classList.add('on');this.textContent='Following';note('Finding you…');
 if(watchId===null)watchId=navigator.geolocation.watchPosition(pos=>{
  me=[pos.coords.latitude,pos.coords.longitude];note('');
  if(!meDot){meDot=L.marker(me,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);meAcc=L.circle(me,{radius:pos.coords.accuracy,color:'#2b8cff',weight:1,fillOpacity:.08}).addTo(map);map.setView(me,14)}
  else{meDot.setLatLng(me);meAcc.setLatLng(me).setRadius(pos.coords.accuracy);if(follow)map.panTo(me)}
  checkNear();if(document.getElementById('list').style.display==='block')renderList()},
  err=>{note('Location error: '+err.message+' (allow location for this site)');follow=false;document.getElementById('loc').classList.remove('on');document.getElementById('loc').textContent='Locate me'},
  {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
 else if(me)map.panTo(me)};
map.on('dragstart',()=>{if(follow){follow=false;const b=document.getElementById('loc');b.classList.remove('on');b.textContent='Locate me'}});
refresh();
</script></body></html>
